<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Folded Week — Feedback</title>
  <style>
    :root{
      --bg:#343434;
      --panel:#2d2d2d;
      --ink:#f0f0f0;
      --muted:#aaa;
      --line:#666;
      --blue:#08a8e8;
      --yellow:#fff200;
      --danger:#ff9a8b;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:Helvetica,Arial,sans-serif;
    }
    button,input,select{font:inherit}
    button{cursor:pointer}
    a{color:var(--blue)}
    [hidden]{display:none!important}
    .shell{
      width:min(1240px,100%);
      margin:0 auto;
      padding:42px 48px 64px;
    }
    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:30px;
      margin-bottom:58px;
    }
    .brand{
      margin:0;
      color:var(--blue);
      font-size:31px;
      line-height:1;
      font-weight:700;
      letter-spacing:-.02em;
    }
    .brand span{color:var(--yellow)}
    .subhead{
      margin:8px 0 0;
      color:#d5d5d5;
      font-size:15px;
    }
    .top-actions{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .button{
      border:1px solid var(--blue);
      background:transparent;
      color:var(--blue);
      padding:10px 14px;
      font-weight:700;
    }
    .button:hover,.button:focus-visible{background:rgba(8,168,232,.1)}
    .button.primary{background:var(--blue);color:#fff}
    .button:disabled{opacity:.5;cursor:wait}

    .login-card{
      width:min(540px,100%);
      margin:90px auto 0;
      padding:40px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:-24px 20px 0 rgba(8,168,232,.4);
    }
    .login-card h2{
      margin:0 0 12px;
      color:var(--blue);
      font-size:29px;
    }
    .login-card p{
      margin:0 0 26px;
      color:#d1d1d1;
      line-height:1.45;
    }
    .login-row{display:flex;gap:10px}
    .login-row input{
      min-width:0;
      flex:1;
      padding:13px 15px;
      background:#222;
      color:#fff;
      border:1px solid var(--line);
      border-radius:10px;
      outline:none;
    }
    .login-row input:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
    .status{min-height:20px;margin:16px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
    .status.error{color:var(--danger)}
    .status.success{color:var(--yellow)}

    .toolbar{
      display:grid;
      grid-template-columns:minmax(240px,1fr) 180px auto;
      gap:12px;
      margin-bottom:22px;
    }
    .toolbar input,.toolbar select{
      width:100%;
      padding:11px 13px;
      color:var(--ink);
      background:#2b2b2b;
      border:1px solid var(--line);
      border-radius:8px;
      outline:none;
    }
    .toolbar input:focus,.toolbar select:focus{border-color:var(--blue)}
    .count{
      margin:0 0 16px;
      color:var(--muted);
      font-size:13px;
    }

    .feedback-list{display:grid;gap:14px}
    .feedback-card{
      display:grid;
      grid-template-columns:150px minmax(0,1fr);
      gap:22px;
      padding:20px 22px;
      background:#303030;
      border:1px solid #555;
      border-radius:12px;
    }
    .feedback-card:hover{border-color:#777}
    .meta-col{min-width:0}
    .type-badge{
      display:inline-block;
      margin-bottom:11px;
      padding:5px 9px;
      border-radius:999px;
      background:var(--yellow);
      color:#252525;
      font-size:12px;
      font-weight:700;
      text-transform:capitalize;
    }
    .when{color:#ddd;font-size:13px;line-height:1.35}
    .viewport{margin-top:6px;color:#929292;font-size:12px}
    .message{
      margin:0 0 16px;
      color:#fff;
      font-size:18px;
      line-height:1.45;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }
    .details{
      display:grid;
      grid-template-columns:minmax(180px,.75fr) minmax(250px,1.25fr);
      gap:8px 24px;
      padding-top:13px;
      border-top:1px solid #4d4d4d;
      color:#aaa;
      font-size:12px;
      line-height:1.4;
    }
    .details strong{color:#ccc;font-weight:700}
    .details a{overflow-wrap:anywhere}
    .ua{grid-column:1/-1;overflow-wrap:anywhere}
    .empty{
      padding:46px 20px;
      text-align:center;
      color:var(--muted);
      border:1px dashed #666;
      border-radius:12px;
    }

    @media(max-width:760px){
      .shell{padding:28px 20px 46px}
      .topbar{display:block;margin-bottom:34px}
      .top-actions{margin-top:20px}
      .toolbar{grid-template-columns:1fr}
      .feedback-card{grid-template-columns:1fr;gap:12px}
      .details{grid-template-columns:1fr}
      .ua{grid-column:auto}
      .login-card{margin-top:48px;padding:30px 22px}
      .login-row{display:grid}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1 class="brand">Folded Week <span>feedback</span></h1>
        <p class="subhead">Private response viewer</p>
      </div>
      <div id="topActions" class="top-actions" hidden>
        <button id="refreshButton" class="button" type="button">Refresh</button>
        <button id="signOutButton" class="button" type="button">Sign out</button>
      </div>
    </header>

    <section id="loginView" class="login-card">
      <h2>Admin sign in</h2>
      <p>Enter the admin email and we’ll send a magic sign-in link. No password required.</p>
      <form id="loginForm">
        <div class="login-row">
          <input id="emailInput" type="email" autocomplete="email" placeholder="Email" required>
          <button id="loginButton" class="button primary" type="submit">Send magic link</button>
        </div>
        <p id="loginStatus" class="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="adminView" hidden>
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Search feedback, email, or page…" aria-label="Search feedback">
        <select id="typeFilter" aria-label="Filter by feedback type">
          <option value="all">All types</option>
          <option value="bug">Bugs</option>
          <option value="suggestion">Suggestions</option>
          <option value="other">Other</option>
        </select>
        <button id="refreshButton2" class="button" type="button">Refresh</button>
      </div>
      <p id="resultCount" class="count"></p>
      <p id="adminStatus" class="status" aria-live="polite"></p>
      <div id="feedbackList" class="feedback-list"></div>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const CONFIG = {
      supabaseUrl: 'https://inftuytlqkkzdkfibdvr.supabase.co',
      supabasePublishableKey: 'sb_publishable_Mts-SQyITzyyrYiGQ1ZCDA_fMwb5TgQ',
      adminEmail: 'craig@rayogram.com'
    };

    const supabase = createClient(CONFIG.supabaseUrl, CONFIG.supabasePublishableKey, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    const $ = (s) => document.querySelector(s);
    const loginView = $('#loginView');
    const adminView = $('#adminView');
    const topActions = $('#topActions');
    const loginForm = $('#loginForm');
    const emailInput = $('#emailInput');
    const loginButton = $('#loginButton');
    const loginStatus = $('#loginStatus');
    const adminStatus = $('#adminStatus');
    const feedbackList = $('#feedbackList');
    const resultCount = $('#resultCount');
    const searchInput = $('#searchInput');
    const typeFilter = $('#typeFilter');
    const refreshButtons = [$('#refreshButton'), $('#refreshButton2')];

    let rows = [];

    function setStatus(el, text, kind='') {
      el.textContent = text;
      el.className = `status${kind ? ' ' + kind : ''}`;
    }

    function normalizeEmail(value='') {
      return value.trim().toLowerCase();
    }

    function formatDate(value) {
      if (!value) return '';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value;
      return new Intl.DateTimeFormat('en-US', {
        month:'short', day:'numeric', year:'numeric',
        hour:'numeric', minute:'2-digit'
      }).format(d);
    }

    function hostnameLabel(url) {
      try {
        const u = new URL(url);
        const path = u.pathname + (u.search || '');
        return path === '/' ? u.hostname : path;
      } catch {
        return url || '—';
      }
    }

    function appendText(parent, tag, text, className='') {
      const el = document.createElement(tag);
      if (className) el.className = className;
      el.textContent = text;
      parent.appendChild(el);
      return el;
    }

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      const type = typeFilter.value;
      const filtered = rows.filter(row => {
        if (type !== 'all' && row.type !== type) return false;
        if (!q) return true;
        return [row.message, row.email, row.page_url, row.user_agent, row.viewport, row.type]
          .filter(Boolean)
          .some(v => String(v).toLowerCase().includes(q));
      });

      resultCount.textContent = `${filtered.length} response${filtered.length === 1 ? '' : 's'}${filtered.length !== rows.length ? ` shown · ${rows.length} total` : ''}`;
      feedbackList.replaceChildren();

      if (!filtered.length) {
        appendText(feedbackList, 'div', rows.length ? 'No feedback matches those filters.' : 'No feedback yet.', 'empty');
        return;
      }

      filtered.forEach(row => {
        const card = document.createElement('article');
        card.className = 'feedback-card';

        const meta = document.createElement('div');
        meta.className = 'meta-col';
        appendText(meta, 'span', row.type || 'other', 'type-badge');
        appendText(meta, 'div', formatDate(row.created_at), 'when');
        if (row.viewport) appendText(meta, 'div', row.viewport, 'viewport');

        const content = document.createElement('div');
        appendText(content, 'p', row.message || '', 'message');

        const details = document.createElement('div');
        details.className = 'details';

        const emailWrap = document.createElement('div');
        const emailStrong = appendText(emailWrap, 'strong', 'Email: ');
        if (row.email) {
          const a = document.createElement('a');
          a.href = `mailto:${row.email}`;
          a.textContent = row.email;
          emailWrap.appendChild(a);
        } else {
          emailWrap.append('—');
        }
        details.appendChild(emailWrap);

        const pageWrap = document.createElement('div');
        appendText(pageWrap, 'strong', 'Page: ');
        if (row.page_url) {
          const a = document.createElement('a');
          a.href = row.page_url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = hostnameLabel(row.page_url);
          pageWrap.appendChild(a);
        } else {
          pageWrap.append('—');
        }
        details.appendChild(pageWrap);

        const ua = document.createElement('div');
        ua.className = 'ua';
        appendText(ua, 'strong', 'Browser/device: ');
        ua.append(row.user_agent || '—');
        details.appendChild(ua);

        content.appendChild(details);
        card.append(meta, content);
        feedbackList.appendChild(card);
      });
    }

    async function loadFeedback() {
      refreshButtons.forEach(b => b.disabled = true);
      setStatus(adminStatus, 'Loading…');
      const { data, error } = await supabase
        .from('feedback')
        .select('id, created_at, type, message, email, page_url, user_agent, viewport')
        .order('created_at', { ascending: false })
        .limit(1000);

      refreshButtons.forEach(b => b.disabled = false);
      if (error) {
        rows = [];
        render();
        setStatus(adminStatus, `Couldn’t load feedback: ${error.message}`, 'error');
        return;
      }
      rows = data || [];
      setStatus(adminStatus, '');
      render();
    }

    async function showForSession(session) {
      const email = normalizeEmail(session?.user?.email || '');
      const isAdmin = email === normalizeEmail(CONFIG.adminEmail);
      loginView.hidden = !!session && isAdmin;
      adminView.hidden = !session || !isAdmin;
      topActions.hidden = !session || !isAdmin;

      if (session && !isAdmin) {
        await supabase.auth.signOut();
        setStatus(loginStatus, 'This account is not authorized to view Folded Week feedback.', 'error');
        return;
      }
      if (session && isAdmin) await loadFeedback();
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      setStatus(loginStatus, '');
      const email = normalizeEmail(emailInput.value);
      if (email !== normalizeEmail(CONFIG.adminEmail)) {
        setStatus(loginStatus, 'That email is not authorized for this page.', 'error');
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = 'Sending…';
      const redirectTo = `${window.location.origin}${window.location.pathname}`;
      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: redirectTo,
          shouldCreateUser: true
        }
      });
      loginButton.disabled = false;
      loginButton.textContent = 'Send magic link';

      if (error) {
        setStatus(loginStatus, error.message, 'error');
      } else {
        setStatus(loginStatus, 'Magic link sent. Check your email and open the link on this device.', 'success');
      }
    });

    $('#signOutButton').addEventListener('click', async () => {
      await supabase.auth.signOut();
      rows = [];
      feedbackList.replaceChildren();
      setStatus(loginStatus, 'Signed out.');
    });

    refreshButtons.forEach(button => button.addEventListener('click', loadFeedback));
    searchInput.addEventListener('input', render);
    typeFilter.addEventListener('change', render);

    supabase.auth.onAuthStateChange((_event, session) => {
      // Delay the query out of the auth callback to avoid nested Supabase calls.
      window.setTimeout(() => showForSession(session), 0);
    });

    const { data: { session } } = await supabase.auth.getSession();
    await showForSession(session);
  </script>
</body>
</html>
