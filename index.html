<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Folded Week — one-sheet photo diary</title>
  <style>
    :root { --ink:#111; --muted:#777; --line:#ddd; --paper:#fff; --bg:#f3f3f1; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); }
    button, input { font:inherit; }
    button { cursor:pointer; }
    .app { max-width:1200px; margin:0 auto; padding:28px 20px 60px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:24px; }
    h1 { margin:0; font-size:22px; letter-spacing:-.02em; }
    .tagline { color:var(--muted); margin-top:4px; }
    .steps { display:flex; gap:8px; }
    .step-pill { border:1px solid var(--line); border-radius:999px; padding:8px 12px; color:var(--muted); background:white; }
    .step-pill.active { color:white; background:#111; border-color:#111; }
    .panel { background:none; border:0px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 8px 28px rgba(0,0,0,.00); }
    .screen[hidden] { display:none; }
    label { display:block; font-weight:700; margin-bottom:8px; }
    input[type="text"], input[type="date"] { width:100%; padding:14px 15px; border:1px solid #bbb; border-radius:10px; background:#fff; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .field { margin-bottom:18px; }
    .upload-zone { display:block; border:2px dashed #aaa; border-radius:16px; padding:34px; text-align:center; background:#fafafa; }
    .upload-zone.drag { border-color:#111; background:#f0f0ed; }
    .upload-zone input { display:none; }
    .upload-zone strong { display:block; font-size:20px; margin-bottom:6px; }
    .muted { color:var(--muted); }
    .actions { margin-top:22px; display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .primary, .secondary { border-radius:999px; padding:12px 18px; border:1px solid #111; }
    .primary { background:#111; color:#fff; }
    .secondary { background:white; color:#111; }
    .primary:disabled { opacity:.35; cursor:not-allowed; }
    .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; margin-top:18px; }
    .thumb { border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; }
    .thumb img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; }
    .thumb-meta { padding:10px; font-size:13px; }
    .arrange-layout { display:block; }
    .photo-list { display:grid; gap:12px; }
    .photo-card { display:grid; grid-template-columns:74px 1fr; gap:10px; border:1px solid var(--line); border-radius:14px; padding:10px; background:white; cursor:grab; }
    .photo-card.selected { border-color:#111; box-shadow:0 0 0 2px #111 inset; }
    .photo-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
    .mini-button { border:1px solid #aaa; background:white; border-radius:999px; padding:5px 9px; font-size:12px; }
    .mini-button.danger { color:#8b1111; border-color:#d1a3a3; }
    .spread-label { font-size:12px; color:var(--muted); margin:0 0 5px; text-align:center; }
    .photo-card.dragging { opacity:.45; }
    .photo-card img { width:74px; height:74px; object-fit:cover; border-radius:9px; }
    .photo-card .topline { display:flex; justify-content:space-between; gap:8px; align-items:center; margin-bottom:8px; }
    .badge { font-size:11px; text-transform:uppercase; letter-spacing:.08em; border:1px solid #aaa; border-radius:999px; padding:4px 7px; }
    input[type="range"] { width:100%; }
    .preview-wrap { position:relative; }
    .book-preview {border-radius:14px; padding:22px; overflow:auto; display:flex; flex-wrap:wrap; align-items:flex-start; align-content:flex-start; gap:22px 18px; border: rgb(135, 132, 132) 1px solid;}
    .editor-row { position:relative; margin:0; width:100%; max-width:200px; cursor:grab; flex:0 0 200px; }
    .editor-row.dragging { opacity:.45; }
    .editor-row.fixed { cursor:default; }
    .editor-spread { position:relative; aspect-ratio:2/1.4142; background:#fff; overflow:hidden; box-shadow:0 1px 5px rgba(0,0,0,.2); }
    .editor-single { position:relative; width:50%; margin:0 auto; aspect-ratio:1/1.4142; background:#fff; overflow:hidden; box-shadow:0 1px 5px rgba(0,0,0,.2); }
    .editor-spread::after { content:""; position:absolute; z-index:8; top:0; bottom:0; left:50%; width:1px; background:rgba(0,0,0,.28); pointer-events:none; }
    .layout-image { position:absolute; max-width:none; max-height:none; user-select:none; -webkit-user-drag:none; touch-action:none; cursor:move; z-index:2; }
    .layout-image.selected { outline:2px solid #1473e6; outline-offset:-2px; }
    .resize-handle { position:absolute; width:14px; height:14px; background:white; border:2px solid #1473e6; border-radius:2px; z-index:12; touch-action:none; }
    .resize-handle.nw { left:-7px; top:-7px; cursor:nwse-resize; }
    .resize-handle.ne { right:-7px; top:-7px; cursor:nesw-resize; }
    .resize-handle.sw { left:-7px; bottom:-7px; cursor:nesw-resize; }
    .resize-handle.se { right:-7px; bottom:-7px; cursor:nwse-resize; }
    .image-box { position:absolute; z-index:6; touch-action:none; }
    .page-text { position:absolute; color:white; z-index:7; pointer-events:none; text-shadow:0 1px 7px rgba(0,0,0,.65); }
    .cover-date { left:5.5%; top:4.4%; font-family:Helvetica,Arial,sans-serif; font-weight:700; font-size:clamp(14px,3vw,44px); }
    .cover-title { left:5.5%; top:12%; width:88%; font-family:"Times New Roman",Times,serif; font-weight:700; font-size:clamp(15px,2.9vw,42px); line-height:1.05; }
    .photo-caption { left:5.5%; bottom:3.4%; max-width:88%; font-family:Helvetica,Arial,sans-serif; font-size:clamp(7px,.95vw,14px); font-weight:400; }
    .empty-page { position:absolute; inset:0; display:grid; place-items:center; color:#aaa; font-size:12px; z-index:1; }
    .spread { display:grid; grid-template-columns:1fr 1fr; gap:3px; margin-bottom:10px; }
    .single-page-row { display:flex; justify-content:center; margin-bottom:10px; }
    .single-page-row .page { width:calc(50% - 1.5px); flex:0 0 calc(50% - 1.5px); }
    .page { aspect-ratio:1/1.4142; background:#fff; position:relative; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.16); }
    .page canvas { width:100%; height:100%; display:block; }
    .publish-options { display:grid; gap:14px; max-width:520px; }
    .check { display:flex; gap:10px; align-items:center; font-weight:700; }
    .summary { border-top:1px solid var(--line); margin-top:18px; padding-top:18px; color:var(--muted); line-height:1.6; }
    .status { min-height:24px; color:var(--muted); }
    .progress-shell { height:10px; background:#e5e5e2; border-radius:999px; overflow:hidden; margin:18px 0 8px; display:none; }
    .progress-shell.active { display:block; }
    .progress-bar { height:100%; width:0%; background:#111; transition:width .2s ease; }
    .modal-backdrop { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.58); display:grid; place-items:center; padding:20px; }
    .modal-backdrop[hidden] { display:none; }
    .modal { width:min(520px,100%); background:#fff; border-radius:18px; padding:22px; box-shadow:0 24px 80px rgba(0,0,0,.32); }
    .modal-head { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:18px; }
    .modal-head h3 { margin:0; }
    .modal-preview { width:100%; aspect-ratio:16/10; background:#111; border-radius:12px; overflow:hidden; margin:0 0 16px; }
    .modal-preview img { width:100%; height:100%; object-fit:contain; display:block; }
    .modal-divider { grid-column:1/-1; height:1px; background:var(--line); margin:2px 0; }
    .icon-button { border:0; background:transparent; font-size:22px; line-height:1; padding:2px 8px; }
    .modal-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .modal-actions button { border:1px solid #aaa; background:white; border-radius:12px; padding:12px; text-align:left; }
    .modal-actions button.danger { color:#8b1111; border-color:#d1a3a3; }
    .arrange-note { max-width:760px; margin:0 0 18px; }
    .editor-row::before { content:'↕'; position:absolute; left:-30px; top:50%; transform:translateY(-50%); color:#777; font-size:20px; }
    .editor-row.fixed::before { content:''; }



    /* Folded Week dark workspace */
    :root {
      --ink:#f2f2f2;
      --muted:#9a9a9a;
      --line:#373737;
      --paper:#fff;
      --bg:#111;
      --panel:#191919;
      --card:#222;
      --selection:#fff;
    }
    body { color:var(--ink); background:var(--bg); }
    .app { max-width:1280px; }
    .step-pill { border-color:var(--line); color:var(--muted); background:#191919; }
    .step-pill.active { color:#111; background:#fff; border-color:#fff; }
    .panel { background:transparent; }
    input[type="text"], input[type="date"] {
      color:var(--ink); background:#1d1d1d; border-color:#444; color-scheme:dark;
    }
    .upload-zone { border-color:#4a4a4a; background:#181818; }
    .upload-zone:hover, .upload-zone.drag { border-color:#fff; background:#202020; }
    .primary, .secondary { border-color:#fff; }
    .primary { background:#fff; color:#111; }
    .secondary { background:transparent; color:#fff; }
    .secondary:hover { background:#202020; }
    .thumb, .photo-card { background:#1c1c1c; }
    .mini-button { color:var(--ink); border-color:#555; background:#222; }
    .book-preview {
      min-height:250px;
      padding:28px;
      border:1px solid #353535;
      border-radius:16px;
      background:#181818;
      display:flex;
      flex-wrap:wrap;
      align-items:flex-start;
      align-content:flex-start;
      gap:16px 14px;
      overflow:visible;
    }
    .editor-row {
      position:relative;
      width:200px;
      max-width:none;
      flex:0 0 200px;
      margin:0;
      cursor:grab;
      transition:width .2s ease, flex-basis .2s ease, transform .2s ease, opacity .2s ease;
    }
    .editor-row.single-row {
      width:94px;
      flex-basis:94px;
    }
    .editor-row::before { content:none !important; display:none !important; }
    .spread-label { display:none; }
    .editor-spread {
      width:200px;
      aspect-ratio:2/1.4142;
      background:#fff;
      border-radius:2px;
      box-shadow:0 8px 24px rgba(0,0,0,.45);
    }
    .editor-single {
      width:94px;
      margin:0;
      aspect-ratio:1/1.4142;
      background:#fff;
      border-radius:2px;
      box-shadow:0 8px 24px rgba(0,0,0,.45);
    }
    .editor-spread::after { background:rgba(0,0,0,.24); }
    .image-box::after {
      content:'✥';
      position:absolute;
      left:50%; top:50%;
      transform:translate(-50%,-50%);
      z-index:15;
      color:#fff;
      font-size:24px;
      line-height:1;
      opacity:0;
      pointer-events:none;
      text-shadow:0 2px 8px rgba(0,0,0,.8);
      transition:opacity .15s ease;
    }
    .image-box:hover::after { opacity:.85; }
    .layout-image.selected {
      outline:2px solid var(--selection);
      outline-offset:-2px;
      filter:drop-shadow(0 0 7px rgba(255,255,255,.55));
    }
    .resize-handle { background:#111; border-color:#fff; }
    .empty-page { color:#888; background:#fff; }
    .summary { border-color:var(--line); }
    .progress-shell { background:#333; }
    .progress-bar { background:#fff; }
    .modal-backdrop { background:rgba(0,0,0,.78); backdrop-filter:blur(4px); }
    .modal {
      width:min(560px,100%);
      color:var(--ink);
      background:#1b1b1b;
      border:1px solid #353535;
      box-shadow:0 30px 100px rgba(0,0,0,.75);
    }
    .modal-preview {
      position:relative;
      width:100%;
      aspect-ratio:1/1.4142;
      max-height:56vh;
      background:#0d0d0d;
      border:1px solid #343434;
      border-radius:12px;
      overflow:hidden;
      margin:0 0 16px;
      transition:aspect-ratio .2s ease;
    }
    .modal-preview.spread { aspect-ratio:2/1.4142; }
    .modal-preview.spread::after {
      content:"";
      position:absolute;
      z-index:20;
      top:0;
      bottom:0;
      left:50%;
      width:1px;
      background:rgba(255,255,255,.72);
      box-shadow:0 0 0 1px rgba(0,0,0,.28), 0 0 8px rgba(0,0,0,.55);
      pointer-events:none;
    }
    .book-preview .image-box { pointer-events:none; }
    .book-preview .layout-image { cursor:inherit; }
    .modal-preview .image-box { cursor:move; }
    .modal-preview .image-box::after { content:none; }
    .modal-preview .layout-image.selected { outline:none; filter:none; }
    .modal-preview .resize-handle { width:16px; height:16px; }
    .modal-editor-note { margin:-6px 0 16px; font-size:13px; color:var(--muted); text-align:center; }
    .modal-actions { grid-template-columns:1fr; gap:8px; }
    .modal-actions button {
      color:var(--ink);
      border:1px solid #424242;
      background:#232323;
      text-align:left;
    }
    .modal-actions button:hover { background:#2c2c2c; border-color:#666; }
    .modal-actions button.danger { color:#ff8f8f; border-color:#654040; }
    .modal-divider { background:#393939; margin:6px 0; }
    .modal-done { text-align:center !important; font-weight:700; background:#fff !important; color:#111 !important; border-color:#fff !important; }
    .icon-button { display:none; }
    .check { color:var(--ink); }

    .publish-layout {
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(280px,430px);
      gap:48px;
      align-items:start;
    }
    .publish-options { max-width:none; }
    .publish-proof { position:sticky; top:24px; }
    .publish-proof-label { margin:0 0 10px; font-size:13px; color:var(--muted); }
    .publish-cover-preview {
      width:100%;
      aspect-ratio:1/1.4142;
      overflow:hidden;
      background:#fff;
      border-radius:3px;
      box-shadow:0 18px 55px rgba(0,0,0,.55);
    }
    .publish-cover-preview canvas { width:100%; height:100%; display:block; }
    .publish-proof .primary { width:100%; margin-top:16px; }
    .publish-back { margin-top:26px; }
    .publish-status { margin-top:12px; }

    .modal {
      height:80vh;
      max-height:80vh;
      overflow-y:auto;
      overscroll-behavior:contain;
      scrollbar-gutter:stable;
    }
    .modal-head {
      position:sticky;
      top:-22px;
      z-index:30;
      margin:-22px -22px 18px;
      padding:22px 22px 14px;
      background:#1b1b1b;
      border-bottom:1px solid #303030;
    }

    @media (max-width:850px){
      .arrange-layout{grid-template-columns:1fr}
      .preview-wrap{position:static}
      .grid-2{grid-template-columns:1fr}
      .publish-layout{grid-template-columns:1fr;gap:30px}
      .publish-proof{position:static;max-width:430px}
      header{align-items:start;flex-direction:column}
      .steps{flex-wrap:wrap}
    }


    /* UI refresh to match supplied mockups — functionality unchanged */
    :root{
      --mock-bg:#343434;
      --mock-blue:#08a8e8;
      --mock-yellow:#fff200;
      --mock-border:#666;
      --mock-muted:#777;
    }
    body{background:var(--mock-bg);font-family:Helvetica,Arial,Helvetica,sans-serif;}
    .app{max-width:1200px;padding:46px 48px 70px;}
    header{align-items:flex-start;margin-bottom:96px;}
    header>div:first-child{min-width:360px;}
    h1{margin:0;line-height:1;display:flex;align-items:center;gap:4px;font-family:Helvetica,Arial,sans-serif;font-size:32px;font-weight:500;letter-spacing:2px;transform:scaleX(.78);transform-origin:left center;white-space:nowrap;}
    .logo-yellow{color:var(--mock-yellow)}
    .logo-blue{color:var(--mock-blue)}
    .logo-red{display:inline-block;width:30px;height:46px;background:#e6222a;transform:skewY(-10deg);margin:0 4px 0 1px;position:relative;}
    .logo-red::after{content:"";position:absolute;right:-8px;bottom:-7px;border-left:8px solid #0aa7df;border-top:4px solid transparent;border-bottom:4px solid transparent;transform:skewY(10deg);}
    .tagline{display:none;}
    .steps{gap:68px;align-items:center;padding-top:12px;}
    .step-pill{border:0;background:transparent!important;padding:0;border-radius:0;color:var(--mock-blue);font-size:30px;font-weight:300;}
    .step-pill.active{color:var(--mock-yellow);font-weight:700;background:transparent!important;}
    .step-pill.active::first-letter{color:#fff;}
    .panel{padding:0;}

    /* Upload */
    [data-screen="1"]{padding-top:36px;}
    .upload-zone{
      max-width:1068px;
      min-height:386px;
      margin:0 auto;
      border:1px dashed var(--mock-blue);
      border-radius:42px;
      background:transparent;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      padding:40px;
    }
    .upload-zone:hover,.upload-zone.drag{background:transparent;border-color:var(--mock-blue);}
    .upload-zone strong{font-size:0;margin:0;color:var(--mock-blue);}
    .upload-zone strong::after{content:"Drop up to 10 images here";font-size:31px;font-weight:700;}
    .upload-zone .muted{display:none;}

    /* Arrange */
    [data-screen="2"] h2{display:none;}
    .arrange-note{
      max-width:820px;
      margin:0 auto 56px;
      text-align:center;
      color:var(--mock-blue)!important;
      font-size:16px;
      line-height:1.2;
      font-weight:700;
    }
    .book-preview{
      min-height:540px;
      padding:42px 54px;
      border:1px solid var(--mock-blue);
      border-radius:4px;
      background:transparent;
      gap:46px 54px;
      align-content:flex-start;
    }
    .editor-row{width:200px;flex-basis:200px;}
    .editor-row.single-row{width:98px;flex-basis:98px;}
    .editor-spread,.editor-single{box-shadow:none;border:1px solid var(--mock-blue);border-radius:0;}
    .editor-spread::after{background:var(--mock-blue);}
    .editor-row.single-row:first-child::after,
    .editor-row.single-row:last-child::after{
      position:absolute;
      left:calc(100% + 18px);
      top:50%;
      transform:translateY(-50%);
      color:var(--mock-blue);
      font-size:20px;
      line-height:1.2;
      white-space:pre;
    }
    .editor-row.single-row:first-child::after{content:"Front\A Cover";}
    .editor-row.single-row:last-child::after{content:"Back\A Cover";}
    [data-screen="2"] .actions{justify-content:flex-end;margin-top:38px;}
    [data-screen="2"] .secondary{display:none;}
    .primary{background:var(--mock-blue);color:#fff;border:0;border-radius:0;padding:12px 20px;font-weight:700;font-size:22px;}
    [data-screen="2"] .primary{font-size:0;}
    [data-screen="2"] .primary::after{content:"Preview";font-size:22px;}

    /* Publish */
    [data-screen="3"] h2{display:none;}
    .publish-layout{grid-template-columns:minmax(0,1fr) 430px;gap:86px;align-items:start;}
    .publish-options{gap:28px;max-width:590px;}
    .field{margin-bottom:12px;}
    .field>label{display:none;}
    input[type="text"],input[type="date"]{
      background:transparent;
      border:1px solid var(--mock-border);
      border-radius:28px;
      min-height:66px;
      padding:10px 22px;
      color:var(--mock-blue);
      font-size:22px;
      font-weight:700;
    }
    input::placeholder{color:var(--mock-muted);opacity:1;font-weight:400;}
    input[type="date"]{color:var(--mock-blue);}
    .grid-2{gap:42px;}
    .check{font-size:22px;color:var(--mock-blue);font-weight:700;gap:20px;}
    .check input{appearance:none;width:38px;height:38px;border:1px solid #777;background:transparent;margin:0;}
    .check input:checked{background:var(--mock-yellow);border-color:var(--mock-blue);box-shadow:inset 0 0 0 1px var(--mock-blue);}
    .summary,.publish-back,.publish-proof-label{display:none;}
    .publish-proof{position:static;}
    .publish-cover-preview{border-radius:0;box-shadow:none;width:430px;}
    .publish-proof .primary{width:auto;margin:0;position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);}
    .publish-proof{position:relative;}
    .publish-status{position:absolute;top:calc(100% + 12px);left:0;right:0;}

    /* Empty publish state styling */
    [data-screen="3"].empty-publish .publish-options{opacity:.45;}

    @media (max-width:900px){
      .app{padding:30px 24px 50px;}
      header{margin-bottom:50px;}
      .steps{gap:22px;flex-wrap:wrap;}
      .step-pill{font-size:22px;}
      .publish-layout{grid-template-columns:1fr;gap:36px;}
      .publish-cover-preview{width:min(430px,100%);}
      .book-preview{padding:28px 24px;gap:34px 30px;}
      h1::before{font-size:36px;}
    }


    /* Logo asset and front-cover row spacing */
    h1.site-logo{
      display:block;
      width:290px;
      max-width:100%;
      transform:none;
      line-height:0;
    }
    h1.site-logo img{
      display:block;
      width:100%;
      height:auto;
    }
    .book-preview > .editor-row.single-row:first-child{
      flex:0 0 100%;
      width:100%;
      max-width:none;
      min-height:140px;
    }
    .book-preview > .editor-row.single-row:first-child .editor-single{
      width:98px;
      margin:0;
    }
    .book-preview > .editor-row.single-row:first-child::after{
      left:116px;
    }

    /* Center-spread highlight and full-area upload progress */
    .book-preview > .editor-row:nth-child(5) .editor-spread{
      border-color:#fff;
    }
    .upload-zone{
      position:relative;
      overflow:hidden;
      isolation:isolate;
      --upload-progress:0%;
    }
    .upload-zone::before{
      content:"";
      position:absolute;
      z-index:-1;
      inset:0 auto 0 0;
      width:var(--upload-progress);
      background:rgba(8,168,232,.24);
      opacity:0;
      transition:width .2s ease, opacity .28s ease;
      pointer-events:none;
    }
    .upload-zone.uploading::before{opacity:1;}
    .upload-zone.upload-complete::before{opacity:0;}
    #progressShell{display:none!important;}

  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1 class="site-logo"><img src="logo-line.png" alt="Folded Week"></h1>
      <div class="tagline">One-Sheet Photo Diaries</div>
    </div>
    <div class="steps">
      <div class="step-pill active" data-step-pill="1">1 Upload</div>
      <div class="step-pill" data-step-pill="2">2 Arrange</div>
      <div class="step-pill" data-step-pill="3">3 Publish</div>
    </div>
  </header>

  <section class="screen panel" data-screen="1">
    <label id="dropZone" class="upload-zone">
      <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple />
      <strong>+ Add up to 10 images</strong>
      <span class="muted">Drop images here or click to choose them.</span>
    </label>
    <div id="progressShell" class="progress-shell"><div id="progressBar" class="progress-bar"></div></div>
    <div id="uploadMessage" class="status"></div>
  </section>

  <section class="screen panel" data-screen="2" hidden>
    <h2 style="margin-top:0">Arrange</h2>
    <p class="muted arrange-note">Drag pages and spreads to reorder the diary.<br>Click a photo to open its crop and layout options.</p>
    <div id="bookPreview" class="book-preview"></div>
    <div class="actions">
      <button class="secondary" data-back="1">← Add images</button>
      <button class="primary" data-next="3">Publish options →</button>
    </div>
  </section>

  <section class="screen panel" data-screen="3" hidden>
    <h2 style="margin-top:0">Publish</h2>
    <div class="publish-layout">
      <div>
        <div class="publish-options">
          <div class="field"><label for="title">Title</label><input id="title" type="text" value="Diary Title" maxlength="80" /></div>
          <div class="grid-2">
            <div class="field"><label for="startDate">Start date</label><input id="startDate" type="date" aria-label="Start Date" /></div>
            <div class="field"><label for="endDate">End date</label><input id="endDate" type="date" aria-label="End Date" /></div>
          </div>
          <label class="check"><input id="includeDate" type="checkbox" checked /> Show photo date</label>
          <label class="check"><input id="includeLocation" type="checkbox" checked /> Show location</label>
        </div>
        <div class="summary" id="publishSummary"></div>
        <button class="secondary publish-back" data-back="2">← Arrange</button>
      </div>
      <aside class="publish-proof">
        <p class="publish-proof-label">Cover preview</p>
        <div id="publishCoverPreview" class="publish-cover-preview" aria-label="Live cover preview"></div>
        <button id="publishBtn" class="primary">Publish</button>
        <div id="publishStatus" class="status publish-status"></div>
      </aside>
    </div>
  </section>
</div>

<div id="photoModal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="photoModalTitle">
    <div class="modal-head"><h3 id="photoModalTitle">Image options</h3><button id="closeModal" class="icon-button" aria-label="Close">×</button></div>
    <div id="modalPreview" class="modal-preview" aria-label="Photo crop editor"></div>
    <div class="modal-editor-note">Drag the photo to reposition it. Drag a corner to resize.</div>
    <div class="modal-actions">
      <button id="modalReplace">Replace image</button>
      <button id="modalDelete" class="danger">Delete image</button>
      <button id="modalSpread">Use as single page</button>
      <button id="modalFill">Fill spread</button>
      <div class="modal-divider" aria-hidden="true"></div>
      <button id="modalFront">Make front cover</button>
      <button id="modalBack">Make back cover</button>
      <div class="modal-divider" aria-hidden="true"></div>
      <button id="modalDone" class="modal-done">Done</button>
    </div>
    <input id="modalReplaceInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
(() => {
  const PAGE_W = 1000;
  const PAGE_H = Math.round(PAGE_W * Math.SQRT2);
  const state = { photos: [], step:1, includeDate:true, includeLocation:true, selectedId:null, modalPhotoId:null };
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

  function showStep(n){
    state.step=n;
    $$('.screen').forEach(el => el.hidden = Number(el.dataset.screen)!==n);
    $$('.step-pill').forEach(el => el.classList.toggle('active', Number(el.dataset.stepPill)===n));
    if(n===2){ renderArrange(); }
    if(n===3){ renderSummary(); }
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function localDateInputValue(date){
    const y=date.getFullYear(), m=String(date.getMonth()+1).padStart(2,'0'), d=String(date.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }

  function formatRange(startStr,endStr){
    if(!startStr && !endStr) return '';
    const s=startStr?new Date(startStr+'T12:00:00'):null;
    const e=endStr?new Date(endStr+'T12:00:00'):null;
    const fmt = d => d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    if(!s) return fmt(e); if(!e) return fmt(s); if(startStr===endStr) return fmt(s);
    if(s.getFullYear()===e.getFullYear() && s.getMonth()===e.getMonth()) return `${s.toLocaleDateString('en-US',{month:'long',day:'numeric'})} - ${e.getDate()}, ${e.getFullYear()}`;
    if(s.getFullYear()===e.getFullYear()) return `${s.toLocaleDateString('en-US',{month:'long',day:'numeric'})} - ${e.toLocaleDateString('en-US',{month:'long',day:'numeric'})}, ${e.getFullYear()}`;
    return `${fmt(s)} - ${fmt(e)}`;
  }

  const US_STATE_CODES={
    'Alabama':'AL','Alaska':'AK','Arizona':'AZ','Arkansas':'AR','California':'CA','Colorado':'CO',
    'Connecticut':'CT','Delaware':'DE','Florida':'FL','Georgia':'GA','Hawaii':'HI','Idaho':'ID',
    'Illinois':'IL','Indiana':'IN','Iowa':'IA','Kansas':'KS','Kentucky':'KY','Louisiana':'LA',
    'Maine':'ME','Maryland':'MD','Massachusetts':'MA','Michigan':'MI','Minnesota':'MN',
    'Mississippi':'MS','Missouri':'MO','Montana':'MT','Nebraska':'NE','Nevada':'NV',
    'New Hampshire':'NH','New Jersey':'NJ','New Mexico':'NM','New York':'NY',
    'North Carolina':'NC','North Dakota':'ND','Ohio':'OH','Oklahoma':'OK','Oregon':'OR',
    'Pennsylvania':'PA','Rhode Island':'RI','South Carolina':'SC','South Dakota':'SD',
    'Tennessee':'TN','Texas':'TX','Utah':'UT','Vermont':'VT','Virginia':'VA','Washington':'WA',
    'West Virginia':'WV','Wisconsin':'WI','Wyoming':'WY','District of Columbia':'DC'
  };

  function friendlyPlaceName(value=''){
    return String(value)
      .replace(/^(the\s+)?(city|town|village|borough|municipality)\s+of\s+/i,'')
      .replace(/\s+(county|parish|municipality)$/i,'')
      .replace(/\s+/g,' ')
      .trim();
  }

  function usefulNamedFeature(j){
    const name=friendlyPlaceName(j?.name||'');
    if(!name) return '';
    const category=String(j?.category||j?.class||'').toLowerCase();
    const type=String(j?.type||'').toLowerCase();
    const allowedTypes=new Set([
      'park','garden','nature_reserve','national_park','protected_area','beach','island',
      'valley','peak','waterfall','viewpoint','trail','recreation_ground','attraction'
    ]);
    const allowedCategories=new Set(['leisure','natural']);
    return allowedTypes.has(type)||allowedCategories.has(category) ? name : '';
  }

  function smartLocationLabel(j){
    const a=j?.address||{};
    const countryCode=String(a.country_code||'').toUpperCase();
    const isUS=countryCode==='US';
    const city=friendlyPlaceName(
      a.city||a.town||a.village||a.hamlet||a.municipality||''
    );
    let stateCode=String(a.state_code||'').replace(/^US-/i,'').toUpperCase();
    if(!/^[A-Z]{2}$/.test(stateCode)) stateCode=US_STATE_CODES[a.state]||'';

    // Named outdoor places and landmarks are paired with their city when available.
    const feature=usefulNamedFeature(j);
    if(feature) return [feature,city && city!==feature ? city : ''].filter(Boolean).join(', ');

    // In cities, use the neighborhood plus the city for a friendly but clear caption.
    const neighborhood=friendlyPlaceName(
      a.neighbourhood||a.quarter||a.suburb||a.city_district||''
    );
    if(neighborhood){
      return [neighborhood,city && city!==neighborhood ? city : ''].filter(Boolean).join(', ');
    }

    // Outside dense cities, use the municipality. Add a state abbreviation in the US.
    if(city){
      return isUS ? [city,stateCode].filter(Boolean).join(', ') : city;
    }

    // Last friendly fallback: a named region, but never raw GPS coordinates.
    const region=friendlyPlaceName(a.state_district||a.county||a.state||a.country||'');
    return region;
  }

  async function reverseGeocode(lat,lon){
    try{
      const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=18&addressdetails=1&accept-language=en`;
      const r=await fetch(url,{headers:{'Accept':'application/json'}});
      if(!r.ok) throw new Error('geocoder');
      return smartLocationLabel(await r.json());
    }catch(e){
      console.warn('Location lookup failed',e);
      return '';
    }
  }

  async function readPhotoFile(file){
    const url=URL.createObjectURL(file);
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
    let exif={};
    try{ exif=await exifr.parse(file,{tiff:true,exif:true,gps:true,iptc:true}); }catch(e){}
    const date=exif?.DateTimeOriginal||exif?.CreateDate||exif?.ModifyDate||null;
    const lat=Number.isFinite(exif?.latitude)?exif.latitude:null;
    const lon=Number.isFinite(exif?.longitude)?exif.longitude:null;
    let location='';
    if(lat!==null&&lon!==null) location=await reverseGeocode(lat,lon);
    return {file,url,img,width:img.naturalWidth,height:img.naturalHeight,date:date?new Date(date):null,lat,lon,location};
  }

  async function addFiles(files){
    const selected=[...files].filter(f=>f.type.startsWith('image/')).slice(0,10);
    if(!selected.length) return;
    state.photos.forEach(p=>URL.revokeObjectURL(p.url));
    state.photos=[]; state.selectedId=null;
    const uploadZone=$('#dropZone');
    uploadZone.classList.remove('upload-complete');
    uploadZone.classList.add('uploading');
    uploadZone.style.setProperty('--upload-progress','0%');
    $('#progressShell').classList.add('active');
    $('#progressBar').style.width='0%';
    $('#uploadMessage').textContent=`Preparing ${selected.length} image${selected.length===1?'':'s'}…`;
    for(let i=0;i<selected.length;i++){
      const data=await readPhotoFile(selected[i]);
      state.photos.push({id:uid(),...data,spread:false,pageLayout:null,spreadLayout:null});
      const progress=Math.round(((i+1)/selected.length)*100);
      $('#progressBar').style.width=`${progress}%`;
      uploadZone.style.setProperty('--upload-progress',`${progress}%`);
      $('#uploadMessage').textContent=`Preparing image ${i+1} of ${selected.length}…`;
    }
    state.selectedId=state.photos[0]?.id||null;
    suggestDateRange();
    autoArrange();
    $('#uploadMessage').textContent='Ready.';
    uploadZone.classList.add('upload-complete');
    setTimeout(()=>{
      $('#progressShell').classList.remove('active');
      uploadZone.classList.remove('uploading','upload-complete');
      uploadZone.style.setProperty('--upload-progress','0%');
      showStep(2);
    },300);
  }

  async function replacePhoto(id,file){
    const p=state.photos.find(x=>x.id===id);
    if(!p||!file) return;
    $('#uploadMessage').textContent='Replacing photo…';
    const data=await readPhotoFile(file);
    URL.revokeObjectURL(p.url);
    Object.assign(p,data,{pageLayout:null,spreadLayout:null});
    suggestDateRange();
    refreshAll();
  }

  function deletePhoto(id){
    const index=state.photos.findIndex(x=>x.id===id);
    if(index<0) return;
    URL.revokeObjectURL(state.photos[index].url);
    state.photos.splice(index,1);
    if(state.selectedId===id) state.selectedId=state.photos[Math.min(index,state.photos.length-1)]?.id||null;
    autoArrange();
    refreshAll();
  }

  function refreshAll(){
    if(state.step===2) renderArrange();
    if(state.step===3) renderSummary();
    $('#uploadMessage').textContent=state.photos.length?`${state.photos.length} of 10 images ready.`:'';
  }

  function suggestDateRange(){
    const dates=state.photos.map(p=>p.date).filter(d=>d instanceof Date&&!isNaN(d));
    if(!dates.length) return;
    dates.sort((a,b)=>a-b);
    if(!$('#startDate').value) $('#startDate').value=localDateInputValue(dates[0]);
    if(!$('#endDate').value) $('#endDate').value=localDateInputValue(dates[dates.length-1]);
  }

  function autoArrange(){
    state.photos.forEach(p=>p.spread=false);
    const interior=state.photos.slice(1,-1);
    const spreadsNeeded=Math.max(0,Math.min(interior.length,14-interior.length));
    const candidates=[...interior].sort((a,b)=>(b.width/b.height)-(a.width/a.height));
    candidates.slice(0,spreadsNeeded).forEach(p=>p.spread=true);
  }

  function renderThumbs(){
    $('#thumbs').innerHTML=state.photos.map((p,i)=>`<div class="thumb" data-id="${p.id}"><img src="${p.url}"><div class="thumb-meta"><strong>${i===0?'Front cover':(i===state.photos.length-1&&state.photos.length>1?'Back cover':`Photo ${i+1}`)}</strong><br><span class="muted">${p.date?formatPhotoDate(p.date):'No photo date'}${p.location?` · ${escapeHtml(p.location)}`:''}</span><div class="photo-actions"><button class="mini-button replacePhoto">Replace</button><button class="mini-button danger deletePhoto">Delete</button><input class="replaceInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden></div></div></div>`).join('');
    $('#thumbs').querySelectorAll('.thumb').forEach(card=>wirePhotoActions(card));
  }

  function wirePhotoActions(card){
    const id=card.dataset.id;
    const input=card.querySelector('.replaceInput');
    card.querySelector('.replacePhoto')?.addEventListener('click',()=>input.click());
    input?.addEventListener('change',e=>{ const file=e.target.files?.[0]; if(file) replacePhoto(id,file); });
    card.querySelector('.deletePhoto')?.addEventListener('click',()=>deletePhoto(id));
  }

  function formatPhotoDate(d){ return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
  function escapeHtml(s=''){ return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

  function renderArrange(){
    renderPreview();
  }

  function frameAspect(isSpread){ return (isSpread?PAGE_W*2:PAGE_W)/PAGE_H; }
  function resetLayout(photo,isSpread){
    const fa=frameAspect(isSpread), ia=photo.width/photo.height;
    let w,h;
    if(ia>fa){ h=1; w=ia/fa; } else { w=1; h=fa/ia; }
    const layout={x:(1-w)/2,y:(1-h)/2,w,h};
    if(isSpread) photo.spreadLayout=layout; else photo.pageLayout=layout;
    return layout;
  }
  function ensureLayout(photo,isSpread){
    const key=isSpread?'spreadLayout':'pageLayout';
    return photo[key] || resetLayout(photo,isSpread);
  }

  function buildPagePlan(){
    const pages=Array.from({length:16},()=>({type:'blank'}));
    if(state.photos[0]) pages[0]={type:'cover',photo:state.photos[0]};

    const hasSeparateBackCover=state.photos.length>1;
    const interiorPhotos=hasSeparateBackCover ? state.photos.slice(1,-1) : [];
    let page=1;
    for(const p of interiorPhotos){
      if(page>14) break;
      if(p.spread && page<14){
        pages[page]={type:'photo',photo:p,part:'left'};
        pages[page+1]={type:'photo',photo:p,part:'right'};
        page+=2;
      } else {
        pages[page]={type:'photo',photo:p,part:'single'};
        page+=1;
      }
    }

    if(hasSeparateBackCover) pages[15]={type:'backCover',photo:state.photos[state.photos.length-1]};
    else pages[15]={type:'back'};
    return pages;
  }

  function drawImageLayout(ctx,photo,isSpread,pagePart=null){
    const frameW=isSpread?PAGE_W*2:PAGE_W;
    const l=ensureLayout(photo,isSpread);
    const dx=l.x*frameW-(pagePart==='right'?PAGE_W:0);
    const dy=l.y*PAGE_H;
    const dw=l.w*frameW;
    const dh=l.h*PAGE_H;
    ctx.save();
    ctx.beginPath();ctx.rect(0,0,PAGE_W,PAGE_H);ctx.clip();
    ctx.drawImage(photo.img,dx,dy,dw,dh);
    ctx.restore();
  }

  function captionText(photo){
    const parts=[];
    if(state.includeDate&&photo.date) parts.push(formatPhotoDate(photo.date));
    if(state.includeLocation&&photo.location) parts.push(photo.location);
    return parts.join(' · ');
  }

  function renderPageCanvas(pageObj,index,scale=.28){
    const c=document.createElement('canvas'); c.width=PAGE_W; c.height=PAGE_H; const ctx=c.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,PAGE_W,PAGE_H);
    if(pageObj.type==='cover'){
      const p=pageObj.photo; drawImageLayout(ctx,p,false);
      ctx.fillStyle='white'; ctx.textBaseline='top';
      ctx.font='bold 72px "Franklin Gothic Medium", "Helvetica", Arial, sans-serif';
      ctx.fillText(formatRange($('#startDate').value,$('#endDate').value)||'Date range',55,62);
      ctx.font='bold 68px "Times New Roman", Times, serif';
      wrapText(ctx,$('#title').value||'Untitled',55,165,PAGE_W-110,78);
      drawCaption(ctx,captionText(p));
    } else if(pageObj.type==='photo'){
      const p=pageObj.photo; drawImageLayout(ctx,p,pageObj.part!=='single',pageObj.part==='single'?null:pageObj.part);
      if(pageObj.part!=='right') drawCaption(ctx,captionText(p));
    } else if(pageObj.type==='backCover'){
      const p=pageObj.photo;
      drawImageLayout(ctx,p,false);
      drawCaption(ctx,captionText(p));
    } else if(pageObj.type==='back'){
      ctx.fillStyle='#111';ctx.fillRect(0,0,PAGE_W,PAGE_H);
      ctx.fillStyle='#fff';ctx.font='bold 34px "Times New Roman", Times, serif';ctx.textBaseline='bottom';ctx.fillText($('#title').value||'',55,PAGE_H-70);
      ctx.font='22px "Franklin Gothic Medium", Franklin Gothic Medium", Arial,, sans-serif';ctx.fillText(formatRange($('#startDate').value,$('#endDate').value),55,PAGE_H-35);
    }
    return c;
  }

  function drawCaption(ctx,text){
    if(!text) return;
    ctx.save();ctx.textBaseline='bottom';ctx.font='24px "Franklin Gothic Medium", "Helvetica", Arial, sans-serif';
    ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=7;ctx.fillStyle='white';
    wrapTextBottom(ctx,text,55,PAGE_H-48,PAGE_W-110,30);ctx.restore();
  }
  function wrapText(ctx,text,x,y,maxW,lineH){ const words=text.split(/\s+/);let line='',yy=y;for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy);line=word;yy+=lineH;}else line=test;}if(line)ctx.fillText(line,x,yy);}
  function wrapTextBottom(ctx,text,x,y,maxW,lineH){ const words=text.split(/\s+/), lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=word;}else line=test;}if(line)lines.push(line);lines.slice(-2).forEach((l,i)=>ctx.fillText(l,x,y-(lines.slice(-2).length-1-i)*lineH));}

  function renderPreview(){
    state.includeDate=$('#includeDate')?.checked ?? state.includeDate;
    state.includeLocation=$('#includeLocation')?.checked ?? state.includeLocation;
    const pages=buildPagePlan(); const wrap=$('#bookPreview'); wrap.innerHTML='';
    const rows=[
      {label:'Front cover',indexes:[0],single:true,fixed:true},
      {label:'Pages 2–3',indexes:[1,2]},
      {label:'Pages 4–5',indexes:[3,4]},
      {label:'Pages 6–7',indexes:[5,6]},
      {label:'Pages 8–9',indexes:[7,8]},
      {label:'Pages 10–11',indexes:[9,10]},
      {label:'Pages 12–13',indexes:[11,12]},
      {label:'Pages 14–15',indexes:[13,14]},
      {label:'Back cover',indexes:[15],single:true,fixed:true}
    ];
    rows.forEach(item=>{
      const holder=document.createElement('div'); holder.className='editor-row'+(item.fixed?' fixed':'')+(item.single?' single-row':'');
      const ids=[...new Set(item.indexes.map(i=>pages[i]?.photo?.id).filter(Boolean))];
      holder.dataset.photoIds=ids.join(',');
      const label=document.createElement('div'); label.className='spread-label'; label.textContent=item.label; holder.appendChild(label);
      if(item.single){
        const frame=document.createElement('div'); frame.className='editor-single';
        renderEditablePage(frame,pages[item.indexes[0]],false);
        holder.appendChild(frame);
      } else {
        const frame=document.createElement('div'); frame.className='editor-spread';
        const left=pages[item.indexes[0]], right=pages[item.indexes[1]];
        if(left.type==='photo'&&right.type==='photo'&&left.photo===right.photo&&left.part==='left'&&right.part==='right'){
          addEditableImage(frame,left.photo,true);
        }else{
          const halfL=document.createElement('div');halfL.style.cssText='position:absolute;left:0;top:0;width:50%;height:100%;overflow:hidden';
          const halfR=document.createElement('div');halfR.style.cssText='position:absolute;right:0;top:0;width:50%;height:100%;overflow:hidden';
          renderEditablePage(halfL,left,false);renderEditablePage(halfR,right,false);
          frame.append(halfL,halfR);
        }
        holder.appendChild(frame);
      }
      wrap.appendChild(holder);
    });
    if(window.Sortable){
      new Sortable(wrap,{animation:170,draggable:'.editor-row:not(.fixed)',ghostClass:'dragging',chosenClass:'sortable-chosen',dragClass:'sortable-drag',onEnd:()=>{
        const front=state.photos[0], back=state.photos.length>1?state.photos[state.photos.length-1]:null;
        const middle=[];
        wrap.querySelectorAll('.editor-row:not(.fixed)').forEach(row=>{
          (row.dataset.photoIds||'').split(',').filter(Boolean).forEach(id=>{const p=state.photos.find(x=>x.id===id);if(p&&!middle.includes(p))middle.push(p);});
        });
        const missing=state.photos.slice(1,back?-1:undefined).filter(p=>!middle.includes(p));
        state.photos=[front,...middle,...missing,...(back?[back]:[])].filter(Boolean);
        renderPreview();
      }});
    }
  }

  function renderEditablePage(frame,pageObj,isSpread){
    // Arrange mode shows only the photographs; publication text is added at Publish.
    if(pageObj.type==='cover'||pageObj.type==='backCover'||pageObj.type==='photo'){
      addEditableImage(frame,pageObj.photo,false);
    }else if(pageObj.type==='back'){
      frame.style.background='#111';
    }else{
      const e=document.createElement('div');e.className='empty-page';e.textContent='Empty page';frame.appendChild(e);
    }
  }

  function addCaptionOverlay(frame,photo,isSpread){
    const text=captionText(photo);if(!text)return;
    const cap=document.createElement('div');cap.className='page-text photo-caption';cap.textContent=text;
    if(isSpread) cap.style.maxWidth='44%';
    frame.appendChild(cap);
  }

  function addEditableImage(frame,photo,isSpread){
    // Arrange is only for ordering pages. Image cropping happens in the detail modal.
    const l=ensureLayout(photo,isSpread);
    const box=document.createElement('div');box.className='image-box';box.dataset.id=photo.id;
    box.style.left=(l.x*100)+'%';box.style.top=(l.y*100)+'%';box.style.width=(l.w*100)+'%';box.style.height=(l.h*100)+'%';
    const img=document.createElement('img');img.src=photo.url;img.className='layout-image';img.style.cssText='left:0;top:0;width:100%;height:100%';
    box.appendChild(img);frame.appendChild(box);
    // Keep the image layer passive so Sortable receives pointer events from the page tile.
    // A normal click still opens the photo editor; dragging reorders the tile.
    if(!frame.dataset.photoClickBound){
      frame.dataset.photoClickBound='true';
      frame.addEventListener('click',e=>{
        if(frame.closest('.sortable-drag') || frame.closest('.dragging')) return;
        e.preventDefault();
        e.stopPropagation();
        openPhotoModal(photo.id);
      });
    }
  }

  function renderModalEditor(){
    const photo=state.photos.find(x=>x.id===state.modalPhotoId); if(!photo)return;
    const index=state.photos.findIndex(x=>x.id===photo.id);
    const isCover=index===0 || (index===state.photos.length-1&&state.photos.length>1);
    const isSpread=photo.spread&&!isCover;
    const frame=$('#modalPreview');
    frame.innerHTML='';
    frame.classList.toggle('spread',isSpread);
    const l=ensureLayout(photo,isSpread);
    const box=document.createElement('div');box.className='image-box';
    box.style.left=(l.x*100)+'%';box.style.top=(l.y*100)+'%';box.style.width=(l.w*100)+'%';box.style.height=(l.h*100)+'%';
    const img=document.createElement('img');img.src=photo.url;img.className='layout-image';img.style.cssText='left:0;top:0;width:100%;height:100%';
    box.appendChild(img);
    ['nw','ne','sw','se'].forEach(c=>{const h=document.createElement('span');h.className='resize-handle '+c;h.dataset.corner=c;box.appendChild(h);});
    frame.appendChild(box);
    box.addEventListener('pointerdown',e=>{
      if(e.target.classList.contains('resize-handle')) startModalResize(e,frame,box,photo,isSpread,e.target.dataset.corner);
      else startModalMove(e,frame,box,photo,isSpread);
    });
  }

  function startModalMove(e,frame,box,photo,isSpread){
    e.preventDefault();e.stopPropagation();box.setPointerCapture(e.pointerId);
    const r=frame.getBoundingClientRect(), l=ensureLayout(photo,isSpread), sx=e.clientX, sy=e.clientY, ox=l.x, oy=l.y;
    const move=ev=>{l.x=ox+(ev.clientX-sx)/r.width;l.y=oy+(ev.clientY-sy)/r.height;box.style.left=(l.x*100)+'%';box.style.top=(l.y*100)+'%';};
    const up=()=>{box.removeEventListener('pointermove',move);box.removeEventListener('pointerup',up);box.removeEventListener('pointercancel',up);renderPreview();};
    box.addEventListener('pointermove',move);box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
  }

  function startModalResize(e,frame,box,photo,isSpread,corner){
    e.preventDefault();e.stopPropagation();box.setPointerCapture(e.pointerId);
    const r=frame.getBoundingClientRect(), l=ensureLayout(photo,isSpread), orig={...l};
    const ratio=(photo.width/photo.height)/frameAspect(isSpread);
    const fixedX=corner.includes('w')?orig.x+orig.w:orig.x;
    const fixedY=corner.includes('n')?orig.y+orig.h:orig.y;
    const signX=corner.includes('w')?-1:1, signY=corner.includes('n')?-1:1;
    const move=ev=>{
      const px=(ev.clientX-r.left)/r.width, py=(ev.clientY-r.top)/r.height;
      let w=Math.max(.08,Math.abs(px-fixedX)), h=Math.max(.08,Math.abs(py-fixedY));
      const relX=Math.abs(w-orig.w)/Math.max(orig.w,.001), relY=Math.abs(h-orig.h)/Math.max(orig.h,.001);
      if(relX>=relY) h=w/ratio; else w=h*ratio;
      l.w=w;l.h=h;l.x=signX<0?fixedX-w:fixedX;l.y=signY<0?fixedY-h:fixedY;
      box.style.left=(l.x*100)+'%';box.style.top=(l.y*100)+'%';box.style.width=(l.w*100)+'%';box.style.height=(l.h*100)+'%';
    };
    const up=()=>{box.removeEventListener('pointermove',move);box.removeEventListener('pointerup',up);box.removeEventListener('pointercancel',up);renderPreview();};
    box.addEventListener('pointermove',move);box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
  }

  function openPhotoModal(id){
    const p=state.photos.find(x=>x.id===id); if(!p)return;
    state.modalPhotoId=id; state.selectedId=id;
    const index=state.photos.findIndex(x=>x.id===id);
    const isCover=index===0 || (index===state.photos.length-1&&state.photos.length>1);
    renderModalEditor();
    $('#modalFront').disabled=index===0;
    $('#modalBack').disabled=index===state.photos.length-1;
    $('#modalSpread').disabled=isCover;
    $('#modalSpread').textContent=p.spread?'Use as single page':'Use as two-page spread';
    $('#modalFill').textContent=`Fill ${p.spread&&!isCover?'spread':'page'}`;
    $('#photoModal').hidden=false;
    renderPreview();
  }
  function closePhotoModal(){ $('#photoModal').hidden=true; state.modalPhotoId=null; renderPreview(); }

  function renderPublishCover(){
    const host=$('#publishCoverPreview');
    if(!host) return;
    host.innerHTML='';
    const cover=buildPagePlan()[0];
    if(!cover || cover.type!=='cover'){
      const empty=document.createElement('div');
      empty.className='empty-page';
      empty.textContent='Add a front-cover photo';
      host.appendChild(empty);
      return;
    }
    const canvas=renderPageCanvas(cover,0);
    canvas.setAttribute('aria-hidden','true');
    host.appendChild(canvas);
  }

  function renderSummary(){
    state.includeDate=$('#includeDate').checked; state.includeLocation=$('#includeLocation').checked;
    $('#publishSummary').innerHTML=`<strong>${escapeHtml($('#title').value||'Untitled')}</strong><br>${escapeHtml(formatRange($('#startDate').value,$('#endDate').value)||'No date range')}<br>${state.photos.length} photo${state.photos.length===1?'':'s'} · 16 pages · one A-series sheet`;
    renderPublishCover();
  }

  async function publish(){
    if(!state.photos.length) return;
    const btn=$('#publishBtn');btn.disabled=true;$('#publishStatus').textContent='Building your one-sheet diary…';
    try{
      state.includeDate=$('#includeDate').checked; state.includeLocation=$('#includeLocation').checked;
      const pages=buildPagePlan().map((p,i)=>renderPageCanvas(p,i));
      const sheetW=PAGE_W*4, sheetH=PAGE_H*2;
      const mappings=[
        {top:[1,16,13,4],bottom:[8,9,12,5]},
        {top:[3,14,15,2],bottom:[6,11,10,7]}
      ];
      const sheets=mappings.map(m=>{
        const c=document.createElement('canvas');c.width=sheetW;c.height=sheetH;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,sheetW,sheetH);
        m.top.forEach((n,col)=>{ctx.save();ctx.translate((col+1)*PAGE_W,PAGE_H);ctx.rotate(Math.PI);ctx.drawImage(pages[n-1],0,0,PAGE_W,PAGE_H);ctx.restore();});
        m.bottom.forEach((n,col)=>ctx.drawImage(pages[n-1],col*PAGE_W,PAGE_H,PAGE_W,PAGE_H));
        return c;
      });
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true});
      sheets.forEach((s,i)=>{if(i)pdf.addPage('a4','landscape');pdf.addImage(s.toDataURL('image/jpeg',.92),'JPEG',0,0,297,210,undefined,'FAST');});
      const filename=($('#title').value||'folded-week').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.pdf';
      pdf.save(filename);
      $('#publishStatus').textContent='Done. Print duplex, flip on the short edge, fit to page, then fold, cut and staple.';
    }catch(err){console.error(err);$('#publishStatus').textContent='Something went wrong while creating the PDF.';}
    finally{btn.disabled=false;}
  }

  $('#fileInput').addEventListener('change',e=>addFiles(e.target.files));
  const dz=$('#dropZone');['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
  $$('[data-next]').forEach(b=>b.addEventListener('click',()=>showStep(Number(b.dataset.next))));
  $$('[data-back]').forEach(b=>b.addEventListener('click',()=>showStep(Number(b.dataset.back))));
  $('#includeDate').addEventListener('change',()=>{state.includeDate=$('#includeDate').checked;renderSummary();});
  $('#includeLocation').addEventListener('change',()=>{state.includeLocation=$('#includeLocation').checked;renderSummary();});
  $('#publishBtn').addEventListener('click',publish);
  $('#title').addEventListener('input',renderSummary);
  $('#startDate').addEventListener('input',renderSummary);
  $('#endDate').addEventListener('input',renderSummary);
  $('#closeModal').addEventListener('click',closePhotoModal);
  $('#modalDone').addEventListener('click',closePhotoModal);
  $('#photoModal').addEventListener('click',e=>{if(e.target===$('#photoModal'))closePhotoModal();});
  $('#modalReplace').addEventListener('click',()=>$('#modalReplaceInput').click());
  $('#modalReplaceInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(f&&state.modalPhotoId){const id=state.modalPhotoId;await replacePhoto(id,f);openPhotoModal(id);}e.target.value='';});
  $('#modalDelete').addEventListener('click',()=>{if(state.modalPhotoId){deletePhoto(state.modalPhotoId);closePhotoModal();}});
  $('#modalFront').addEventListener('click',()=>{
    const index=state.photos.findIndex(x=>x.id===state.modalPhotoId);
    if(index>0){ const [p]=state.photos.splice(index,1); p.spread=false; state.photos.unshift(p); }
    closePhotoModal(); renderArrange();
  });
  $('#modalBack').addEventListener('click',()=>{
    const index=state.photos.findIndex(x=>x.id===state.modalPhotoId);
    if(index>=0&&index<state.photos.length-1){ const [p]=state.photos.splice(index,1); p.spread=false; state.photos.push(p); }
    closePhotoModal(); renderArrange();
  });
  $('#modalSpread').addEventListener('click',()=>{const p=state.photos.find(x=>x.id===state.modalPhotoId);if(!p)return;p.spread=!p.spread;ensureLayout(p,p.spread);openPhotoModal(p.id);});
  $('#modalFill').addEventListener('click',()=>{const p=state.photos.find(x=>x.id===state.modalPhotoId);if(!p)return;const i=state.photos.findIndex(x=>x.id===p.id);const isCover=i===0||(i===state.photos.length-1&&state.photos.length>1);resetLayout(p,p.spread&&!isCover);renderModalEditor();renderPreview();});
})();
</script>
</body>
</html>
